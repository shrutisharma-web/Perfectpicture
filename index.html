
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Camera App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Camera App</h1>
    <p id="instruction">Look into your camera and click capture.</p>

    <!-- Media container: video and canvas occupy the exact same spot -->
    <div class="media-container">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas" class="hidden"></canvas>
    </div>

    <!-- Initial Capture button -->
    <div id="capture-controls">
      <button id="capture-btn" class="btn btn-primary">Capture</button>
    </div>

    <!-- Post-capture action buttons: Retake and Keep -->
    <div id="review-controls" class="btn-group hidden">
      <button id="retake-btn" class="btn btn-secondary">Retake</button>
      <button id="keep-btn" class="btn btn-success">Keep</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
